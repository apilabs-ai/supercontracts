contract:
  format: apilabs.ai
  version: "1.0"
  type: apptalk-contract

run: gravity_forms_hubspot_deals

apptalk:
  name: gravity_forms_hubspot_deals_contract
  form_provider: gravity_forms
  form_id: "31"
  form_name: gravity_hubspot_deals

  crm_provider: hubspot
  crm_auth_arn: {add your crm auth arn here}
  crm_module: Deals

  cleanup: true

  auth_inputs:
    gravity:
      baseUrl: {add your gravity forms base url here}
      consumerKey: {add your gravity forms consumer key here}
      consumerSecret: {add your gravity forms consumer secret here}

  mappings:
    - sourceLabel: Deal name
      destFieldApiName: Deal Name

    - sourceLabel: Pipeline
      destFieldApiName: Pipeline

    - sourceLabel: Deal stage
      destFieldApiName: Deal Stage

    - sourceLabel: Amount
      destFieldApiName: Amount

    - sourceLabel: Close date
      destFieldApiName: Close Date

flows:
  e2e:
    steps:
      - step: validate
      - step: create_config
      - step: test_sync

tests:
  gravity_forms_hubspot_deals:
    execute: e2e
    verify:
      - "test_sync.response.body.success == true"

