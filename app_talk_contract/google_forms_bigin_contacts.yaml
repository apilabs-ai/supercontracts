contract:
  format: apilabs.ai
  version: "1.0"
  type: apptalk-contract

run: google_forms_bigin_contacts

apptalk:
  name: google_forms_bigin_contacts_contract
  form_provider: google_forms
  form_auth_arn: {add your form auth arn here}
  form_id: "1njPRcTH7_v_o3SdxcSOwTiIDNcnUZ0k7VgRm2apGZgk"
  form_name: Contact Capture Form
  crm_provider: bigin
  crm_auth_arn: {add your crm auth arn here}
  crm_module: Contacts
  cleanup: true
  mappings:
    - sourceLabel: First Name
      destFieldApiName: First_Name
    - sourceLabel: Last Name
      destFieldApiName: Last_Name
    - sourceLabel: Email
      destFieldApiName: Email
    - sourceLabel: Phone
      destFieldApiName: Phone
    - sourceLabel: Company Name
      destFieldApiName: Company Name

flows:
  e2e:
    steps:
      - step: validate
      - step: create_config
      - step: test_sync

tests:
  google_forms_bigin_contacts:
    execute: e2e
    verify:
      - "test_sync.response.body.success == true"

