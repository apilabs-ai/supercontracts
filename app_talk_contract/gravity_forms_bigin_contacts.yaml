contract:
  format: apilabs.ai
  version: "1.0"
  type: apptalk-contract

run: gravity_forms_bigin_contacts

apptalk:
  name: gravity_forms_bigin_contacts_contract
  form_provider: gravity_forms
  form_id: "30"
  form_name: gravity_forms_bigin_contacts

  crm_provider: bigin
  crm_auth_arn: {add your crm auth arn here}
  crm_module: Contacts

  cleanup: true

  auth_inputs:
    gravity:
      baseUrl: {add your gravity forms base url here}
      consumerKey: {add your gravity forms consumer key here}
      consumerSecret: {add your gravity forms consumer secret here}

  mappings:
    - sourceLabel: First Name
      destFieldApiName: First_Name

    - sourceLabel: Last Name
      destFieldApiName: Last_Name

    - sourceLabel: Email
      destFieldApiName: Email

    - sourceLabel: Mobile
      destFieldApiName: Mobile

    - sourceLabel: Company Name
      destFieldApiName: Account_Name

flows:
  e2e:
    steps:
      - step: validate
      - step: create_config
      - step: test_sync

tests:
  gravity_forms_bigin_contacts:
    execute: e2e
    verify:
      - "test_sync.response.body.success == true"
